<section class="access-layout public-page" aria-labelledby="contactTitle">
  <aside class="access-statement"><p>LET’S TALK<br>ABOUT THE<br>MISSION.</p></aside>
  <div class="access-form"><h1 id="contactTitle">Contact us.</h1><p>Questions about KnightEPS? Get in touch.</p>
    <form id="contactForm" class="contact-form">
      <label for="contactName">Your name</label><input class="input" id="contactName" name="name" autocomplete="name" required maxlength="100" aria-describedby="contactNameError"><p class="field-error" id="contactNameError"></p>
      <label for="contactEmail">Email address</label><input class="input" id="contactEmail" name="email" type="email" autocomplete="email" required maxlength="254" aria-describedby="contactEmailError"><p class="field-error" id="contactEmailError"></p>
      <label for="contactMessage">Message</label><textarea class="textarea" id="contactMessage" name="message" required minlength="10" maxlength="5000" aria-describedby="contactMessageError"></textarea><p class="field-error" id="contactMessageError"></p>
      <label class="honey-field" aria-hidden="true">Website<input name="website" tabindex="-1" autocomplete="off"></label>
      <button id="contactSubmit" class="btn" type="submit">Send message</button>
      <p id="contactStatus" class="contact-status" role="status" aria-live="polite"></p>
    </form>
  </div>
</section>
