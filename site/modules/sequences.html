<section id="sequenceEditor" class="page active sequence-page" aria-labelledby="seqHeading">
  <div class="section-header"><div><h2 id="seqHeading">Branch Definition</h2></div><span id="seqState" class="status-pill" role="status" aria-live="polite">Ready</span></div>
  <section class="card"><div class="card-body seq-library"><label>Saved Branch Definitions <select id="seqSaved" class="seq-input"><option value="">New Branch Definition</option></select></label><button id="seqLoad" class="button secondary" type="button">Load</button><button id="seqNew" class="button secondary" type="button">New</button><button id="seqDuplicate" class="button secondary" type="button">Duplicate</button><label class="seq-name">Name <input id="seqName" class="seq-input" maxlength="120" placeholder="Bench startup check"></label><button id="seqSave" class="button" type="button">Save</button></div></section>
  <div class="seq-workspace"><section class="card seq-palette"><div class="card-header"><h3 class="card-title">Blocks</h3></div><div class="card-body"><div id="seqPaletteList"></div></div></section>
  <section class="card seq-canvas-card"><div class="card-header"><h3 class="card-title">Code path</h3><span id="seqCount" class="status-pill">0 blocks</span></div><div class="card-body"><div id="seqCanvas" class="seq-canvas"></div><div id="seqValidation" class="seq-validation" role="alert" aria-live="polite"></div></div></section></div>
  <section class="card"><div class="card-header"><h3 class="card-title">Execution</h3><span id="seqRunState" class="status-pill">Idle</span></div><div class="card-body"><label class="seq-sim-input"><textarea aria-label="Simulation values JSON" id="seqSimulationTelemetry" class="seq-input" rows="3" spellcheck="false" placeholder="{&quot;telemetry&quot;:{&quot;mppt&quot;:{&quot;faults&quot;:[&quot;VAC1_OVP_STAT&quot;]}},&quot;raw&quot;:{&quot;mppt&quot;:{&quot;fault20&quot;:1}},&quot;registers&quot;:{&quot;0x40:0x00&quot;:16679}}"></textarea></label><label class="seq-token-input">Command token for live start or resume <input id="seqToken" class="seq-input" type="password" autocomplete="off"></label><div class="seq-execution-controls"><button id="seqSimulate" class="button secondary" type="button">Simulate</button><button id="seqLive" class="button" type="button">Review live execution</button><button id="seqPause" class="button secondary" type="button">Pause</button><button id="seqResume" class="button secondary" type="button">Resume</button><button id="seqStop" class="button secondary" type="button">Stop</button></div><div id="seqConfirm" class="seq-confirm" hidden><p id="seqConfirmText"></p><div class="seq-execution-controls"><button id="seqConfirmRun" class="button" type="button">Confirm live execution</button><button id="seqCancelRun" class="button secondary" type="button">Cancel</button></div></div><div id="seqRecovery" class="seq-confirm" hidden><p>Live commands are blocked after an unknown outcome or bridge restart. Inspect the device and confirm its state before clearing the block.</p><label class="seq-review"><input id="seqReviewed" type="checkbox"> I reviewed the device state</label><button id="seqRecover" class="button secondary" type="button">Acknowledge review</button></div><div class="seq-progress" role="status" aria-live="polite"><div id="seqProgressLabel">No execution selected</div><progress id="seqProgress" value="0" max="100"></progress><p id="seqRunError"></p></div><ol id="seqEvents" class="seq-events" aria-label="Execution events"></ol></div></section>
  <section id="sequenceHistory" class="card sequence-history" aria-label="Saved Branch Definition runs"></section>
</section>
