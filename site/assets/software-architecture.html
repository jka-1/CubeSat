<!doctype html>

<title>KnightEPS — Software Architecture</title>

<style>
:root {color-scheme:light}
* {box-sizing:border-box}
html,body {margin:0;min-height:100%;background:#f5f5f4}
#ke-chart {
 --ink:#111514;--text:#2c3330;--muted:#757c77;--hair:#dce0dc;--bg:#f5f5f4;
 background:var(--bg);color:var(--ink);position:relative;isolation:isolate;overflow:hidden;
 font-family:Manrope,ui-sans-serif,system-ui,-apple-system,sans-serif;
 font-optical-sizing:auto;width:100%;max-width:1360px;height:clamp(665px,60vw,805px);min-height:665px;margin:0 auto;
}
#ke-chart button{font:inherit;background:none;color:inherit;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
#ke-chart :focus-visible {outline:2px solid #191e1b;outline-offset:3px}
#ke-chart .ke-header {position:absolute;z-index:7;top:28px;left:clamp(18px,4vw,54px);pointer-events:none}
#ke-chart .ke-kicker {font-size:10px;font-weight:800;letter-spacing:.095em}
#ke-chart .ke-descriptor {font-size:11px;color:var(--muted);margin-top:9px;font-weight:500;line-height:1.6;max-width:375px}
#ke-chart .ke-stats {position:absolute;z-index:7;right:clamp(18px,4vw,54px);top:26px;text-align:right;font-size:10px;font-weight:800;letter-spacing:.035em;line-height:1.7}
#ke-chart .ke-stats span {display:block;font-size:10px;font-weight:550;letter-spacing:0;color:#87908b}
#ke-chart .ke-trail {position:absolute;top:96px;left:clamp(18px,4vw,54px);right:clamp(18px,4vw,54px);z-index:8;display:flex;gap:9px;align-items:center;min-height:30px;max-width:calc(100% - 40px);font-size:10px;line-height:1.4;flex-wrap:wrap}
#ke-chart .ke-trail button {padding:4px 0;font-weight:750;color:#6e7670;transition:color .25s ease,transform .35s cubic-bezier(.2,1.5,.3,1)}
#ke-chart .ke-trail button:hover{color:#101513;transform:translateY(-2px)}
#ke-chart .ke-trail button[aria-current="page"] {color:#151918;pointer-events:none}
#ke-chart .ke-trail .sep{color:#b8c0b9;font-size:13px}
#ke-chart .ke-svg{width:100%;height:100%;display:block;position:absolute;inset:0;touch-action:manipulation;user-select:none}
#ke-chart .ke-world {will-change:transform}
#ke-chart .ke-node {cursor:pointer;outline:none;transition:opacity .35s cubic-bezier(.2,.7,.3,1);}
#ke-chart .ke-node .disk {stroke-width:1.15;vector-effect:non-scaling-stroke;transform-box:fill-box;transform-origin:center;
 transition:transform .52s cubic-bezier(.17,1.42,.24,1),fill .32s ease,stroke .35s ease,stroke-width .35s ease,filter .6s ease;
 filter:drop-shadow(0 2px 3px rgba(18,29,23,.036));}
#ke-chart .ke-root .disk {fill:#eff1ee;stroke:#d5d9d4;stroke-width:1;filter:none;}
#ke-chart .ke-system .disk {fill:#e6e9e6;stroke:#c2cac3;filter:drop-shadow(0 2px 5px rgba(18,29,23,.043));}
#ke-chart .ke-module .disk {fill:#fafbfa;stroke:#cdd3cd;}
#ke-chart .ke-file .disk {fill:white;stroke:#d3d9d2;}
#ke-chart .ke-node .rim {fill:none;stroke:#838c83;stroke-width:1.25;vector-effect:non-scaling-stroke;opacity:0;pointer-events:none;
 transform-box:fill-box;transform-origin:center;transform:scale(.99);transition:opacity .3s ease,transform .55s cubic-bezier(.13,1.25,.3,1)}
#ke-chart .ke-node:hover .disk, #ke-chart .ke-node.is-hover .disk, #ke-chart .ke-node:focus-visible .disk {transform:scale(1.045);fill:#fff;stroke:#9ba69c;stroke-width:1.7;filter:drop-shadow(0 7px 12px rgba(19,29,23,.088));}
#ke-chart .ke-node:hover .rim,#ke-chart .ke-node.is-hover .rim,#ke-chart .ke-node:focus-visible .rim{opacity:.47;transform:scale(1.084);}
#ke-chart .ke-node.is-selected .disk {stroke:#28352d;stroke-width:2;filter:drop-shadow(0 6px 10px rgba(17,28,21,.075))}
#ke-chart .ke-node.is-selected .rim {opacity:.4;transform:scale(1.065)}
#ke-chart .ke-node .ke-label {text-anchor:middle;dominant-baseline:middle;fill:#2a312c;font-family:Manrope,ui-sans-serif,system-ui,sans-serif;font-weight:750;
 letter-spacing:-.025em;pointer-events:none;transition:opacity .18s ease,fill .26s ease,transform .42s cubic-bezier(.2,1.5,.3,1);}
#ke-chart .ke-node:hover .ke-label,#ke-chart .ke-node.is-hover .ke-label {fill:#121814;transform:translateY(-1.5px)}
#ke-chart .ke-outer-caption {position:absolute;z-index:5;left:50%;top:137px;transform:translateX(-50%);font-size:9px;letter-spacing:.12em;font-weight:800;color:#a1a9a2;white-space:nowrap;pointer-events:none;transition:opacity .3s}
#ke-chart[data-depth="1"] .ke-outer-caption,#ke-chart[data-depth="2"] .ke-outer-caption {opacity:0}
#ke-chart .ke-bottom {position:absolute;z-index:7;bottom:0;left:clamp(18px,4vw,54px);right:clamp(18px,4vw,54px);
 min-height:83px;border-top:1px solid #dcdedb;display:flex;align-items:center;justify-content:space-between;gap:30px;background:var(--bg)}
#ke-chart .ke-legend {display:flex;align-items:center;flex-wrap:wrap;gap:5px clamp(13px,2vw,25px)}
#ke-chart .ke-legend button {padding:10px 0;font-size:10px;letter-spacing:.02em;font-weight:800;color:#848a85;transition:transform .35s cubic-bezier(.2,1.45,.25,1), color .25s ease;border-bottom:1px solid transparent}
#ke-chart .ke-legend button:hover {transform:translateY(-2px);color:#131815}
#ke-chart .ke-legend button.active {color:#151a16;border-bottom-color:#515950}
#ke-chart .ke-legend button span {font-weight:550;font-size:10px;margin-left:5px;color:#a2a9a2}
#ke-chart .ke-hint {font-size:10px;font-weight:550;line-height:1.65;color:#565e58;text-align:right}
#ke-chart .ke-tooltip {position:absolute;z-index:20;pointer-events:none;opacity:0;visibility:hidden;transform:translateY(9px) scale(.982);
 padding:15px 18px 15px;max-width:290px;width:250px;background:rgba(255,255,255,.98);border:1px solid #e4e7e3;border-radius:3px;
 box-shadow:0 9px 29px rgba(19,29,24,.065);transition:opacity .22s ease,transform .33s cubic-bezier(.17,1.3,.22,1),visibility .22s}
#ke-chart .ke-tooltip.show {opacity:1;visibility:visible;transform:translateY(0) scale(1)}
#ke-chart .ke-tooltip .tip-eyebrow {font-size:9px;font-weight:800;letter-spacing:.09em;color:#929a92;text-transform:uppercase;margin-bottom:8px}
#ke-chart .ke-tooltip .tip-name {font-size:14px;font-weight:800;line-height:1.4;letter-spacing:-.035em;color:#17201a;overflow-wrap:anywhere}
#ke-chart .ke-tooltip .tip-description {font-size:11px;color:#6d776f;line-height:1.65;margin:7px 0 10px;max-height:89px;overflow:hidden}
#ke-chart .ke-tooltip .tip-meta{display:flex;gap:15px;border-top:1px solid #eef0ed;padding-top:10px;font-size:10px;color:#7e8780;font-weight:750}
#ke-chart .ke-panel {position:absolute;z-index:15;right:clamp(18px,4vw,54px);top:27%;width:min(325px,calc(100% - 35px));max-height:58%;overflow:auto;
 padding:27px 26px 24px;border:1px solid #dde2dc;background:#fff;opacity:0;visibility:hidden;pointer-events:none;transform:translateX(14px);
 box-shadow:0 12px 36px rgba(22,29,24,.063);transition:opacity .35s,transform .46s cubic-bezier(.19,1,.22,1),visibility .35s}
#ke-chart .ke-panel.open {opacity:1;visibility:visible;pointer-events:auto;transform:translateX(0)}
#ke-chart .ke-close {position:absolute;top:9px;right:12px;padding:4px 8px;font-size:23px!important;font-weight:400!important;color:#8d9890!important;transition:transform .35s ease,color .2s ease}
#ke-chart .ke-close:hover {color:#141b15!important;transform:rotate(90deg)}
#ke-chart .panel-kicker {font-size:9px;font-weight:800;letter-spacing:.1em;color:#8e968f;text-transform:uppercase;margin:0 20px 12px 0}
#ke-chart .panel-title {font-size:24px;line-height:1.15;font-weight:800;letter-spacing:-.052em;margin:0 0 12px;overflow-wrap:anywhere}
#ke-chart .panel-desc {font-size:12px;font-weight:500;color:#656f67;line-height:1.78;margin:0 0 20px}
#ke-chart .panel-metrics {display:grid;grid-template-columns:1fr 1fr;gap:12px;border-top:1px solid #e9ece8;border-bottom:1px solid #e9ece8;padding:14px 0;margin-bottom:19px}
#ke-chart .panel-metrics strong {display:block;font-size:17px;letter-spacing:-.04em;font-weight:800;color:#182018}
#ke-chart .panel-metrics span {display:block;font-size:9px;font-weight:650;color:#89928a;margin-top:4px;text-transform:uppercase;letter-spacing:.04em}
#ke-chart .panel-files-title {font-weight:800;font-size:10px;letter-spacing:.04em;margin-bottom:12px}
#ke-chart .panel-file {border-top:1px solid #edf0ed;padding:10px 0;display:flex;justify-content:space-between;gap:13px;font-size:10px;line-height:1.5;color:#637068}
#ke-chart .panel-file code{font-family:ui-monospace,SFMono-Regular,monospace;font-size:10px;overflow-wrap:anywhere;color:#34433a}
#ke-chart .panel-file span {white-space:nowrap;color:#909a92}
#ke-chart .panel-note {margin-top:15px;font-size:10px;line-height:1.7;color:#9aa29a}
@media(max-width:900px){
 #ke-chart {height:720px}
 #ke-chart .ke-bottom{display:block;min-height:100px;padding-top:7px}
 #ke-chart .ke-hint{text-align:left;font-size:9px;margin-bottom:6px}
 #ke-chart .ke-legend button{font-size:9px;padding:6px 0}
 #ke-chart .ke-panel{top:auto;bottom:107px;max-height:49%;width:min(325px,calc(100% - 35px))}
}
@media(max-width:560px){
 #ke-chart {height:670px;min-height:640px}
 #ke-chart .ke-header {top:20px;left:18px}
 #ke-chart .ke-descriptor {max-width:200px;font-size:10px;margin-top:6px}
 #ke-chart .ke-stats {top:20px;right:18px;font-size:9px}
 #ke-chart .ke-stats span{font-size:9px}
 #ke-chart .ke-trail{top:81px;left:18px;right:18px;font-size:9px;gap:6px}
 #ke-chart .ke-outer-caption{top:122px;font-size:8px}
 #ke-chart .ke-bottom{left:18px;right:18px;min-height:115px}
 #ke-chart .ke-legend{gap:0 11px}
 #ke-chart .ke-legend button{font-size:8px;padding:6px 0}
 #ke-chart .ke-legend button span{font-size:8px;margin-left:2px}
 #ke-chart .ke-hint{font-size:8px}
 #ke-chart .ke-panel{left:14px;right:14px;bottom:118px;width:auto;max-height:43%;padding:21px 19px}
 #ke-chart .panel-title{font-size:20px}
 #ke-chart .ke-tooltip{display:none}
}
@media(prefers-reduced-motion:reduce){#ke-chart *,#ke-chart *::before,#ke-chart *::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

/* Embedded layout: native document scroll and the complete file list. */
html,body{overflow-x:hidden}#ke-chart{height:805px;max-width:none;min-height:0}
#ke-chart .ke-panel{scrollbar-width:auto;scrollbar-color:#8e9992 #eef0ed;overscroll-behavior:auto;max-height:62%;top:23%;font-size:12px}
#ke-chart .panel-title{letter-spacing:-.03em}#ke-chart .ke-close{min-width:44px;min-height:44px}
#ke-chart .ke-trail button{min-height:44px}#ke-chart .panel-file{font-size:12px}#ke-chart .panel-file code{font-size:11px}
#ke-chart .panel-note{color:#647168}#ke-chart .ke-stats span{color:#647168}
@media(max-width:700px){#ke-chart{height:760px}#ke-chart.has-detail{height:1200px}#ke-chart .ke-panel{top:auto;bottom:24px;left:16px;right:16px;width:auto;max-height:420px}#ke-chart .ke-bottom{bottom:auto;top:640px}#ke-chart.has-detail .ke-bottom{top:640px}#ke-chart .ke-tooltip{display:none}}
</style>
</head>

 return n;
}
const root=buildTree(INPUT_DATA);
function enclosureCenter(items){
 // iterative min-max-centre optimization for an enclosing circle around positioned discs
 let cx=items.reduce((a,b)=>a+b.x,0)/items.length,cy=items.reduce((a,b)=>a+b.y,0)/items.length;
 let step=4;
 for(let i=0;i<260;i++){
  let far=null,val=-Infinity;
  for(const p of items){const d=Math.hypot(p.x-cx,p.y-cy)+p.r;if(d>val){val=d;far=p}}
  const dx=far.x-cx,dy=far.y-cy,dist=Math.hypot(dx,dy);
  if(dist>1e-6){let amount=step*(1-i/280);cx+=amount*dx/dist;cy+=amount*dy/dist}
  if((i+1)%60===0)step*=.65;
 }
 return[cx,cy];
}
function packSiblings(ary,gap){
 const items=[...ary].sort((a,b)=>b.r-a.r||a.name.localeCompare(b.name));
 const placed=[];
 for(const node of items){
  if(!placed.length){node.x=0;node.y=0;placed.push(node);continue}
  let best=null,score=Infinity;
  function check(x,y){
   for(const q of placed)if(Math.hypot(x-q.x,y-q.y)+1e-5<node.r+q.r+gap)return;
   let extent=Math.hypot(x,y)+node.r;
   for(const q of placed)extent=Math.max(extent,Math.hypot(q.x,q.y)+q.r);
   const cost=extent+.002*Math.hypot(x,y);
   if(cost<score){score=cost;best={x,y}};
  }
  for(let a=0;a<placed.length;a++){
    const p=placed[a],pa=p.r+node.r+gap;
    for(let k=0;k<40;k++){const ang=Math.PI*2*k/40;check(p.x+Math.cos(ang)*pa,p.y+Math.sin(ang)*pa)}
    for(let b=a+1;b<placed.length;b++){
     const q=placed[b],qb=q.r+node.r+gap,dx=q.x-p.x,dy=q.y-p.y,d=Math.hypot(dx,dy);
     if(d<1e-7||d>pa+qb||d<Math.abs(pa-qb))continue;
     const z=(pa*pa-qb*qb+d*d)/(2*d),v=Math.sqrt(Math.max(0,pa*pa-z*z)),ux=dx/d,uy=dy/d;
     check(p.x+z*ux-v*uy,p.y+z*uy+v*ux);check(p.x+z*ux+v*uy,p.y+z*uy-v*ux);
    }
  }
  if(!best){const p=placed[0];best={x:p.x+p.r+node.r+gap,y:p.y}}
  node.x=best.x;node.y=best.y;placed.push(node);
 }
 const[cx,cy]=enclosureCenter(placed);
 let radius=0;for(const p of placed){p.x-=cx;p.y-=cy;radius=Math.max(radius,Math.hypot(p.x,p.y)+p.r)}
 return radius;
}
function compute(node){
 if(!node.children.length){node.r=Math.max(1.05,Math.sqrt(node.lines/Math.PI));return}
 node.children.forEach(compute);
 const gap=node.depth===0?5.1:node.depth===1?2.3:1.0;
 const pad=node.depth===0?8:node.depth===1?5.4:2.8;
 node.r=packSiblings(node.children,gap)+pad;
}
function absPos(node,x=0,y=0){node.wx=x+node.x;node.wy=y+node.y;node.children.forEach(c=>absPos(c,node.wx,node.wy))}
compute(root);absPos(root);
const flat=[...index.values()];
function create(){
 // Parents first so every child is painted on top of its container.
 for(const node of flat){
  const g=el('g',{'class':'ke-node ke-'+(['root','system','module','file'][node.depth]),'data-id':node.id,tabindex:node.depth?'0':'-1',role:node.depth?'button':'presentation',
 'aria-label':node.depth?node.name+', '+fmt.format(node.lines)+' nonblank source lines':''});
  g.setAttribute('transform',`translate(${node.wx} ${node.wy})`);
  const c=el('circle',{class:'disk',r:node.r,cx:0,cy:0});const rim=el('circle',{class:'rim',r:node.r,cx:0,cy:0});
  const lbl=el('text',{'class':'ke-label'});g.append(c,rim,lbl);world.appendChild(g);node.g=g;node.label=lbl;
  if(node.depth){
   g.addEventListener('click',e=>{e.stopPropagation();activate(node)});
   g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();activate(node)}});
   g.addEventListener('pointerenter',e=>{hoveredId=node.id;g.classList.add('is-hover');tipShow(node,e)});
   g.addEventListener('pointermove',e=>tipShow(node,e));
   g.addEventListener('pointerleave',()=>{hoveredId=null;g.classList.remove('is-hover');tipHide()});
   g.addEventListener('focus',()=>{g.classList.add('is-hover')});
   g.addEventListener('blur',()=>g.classList.remove('is-hover'));
  }
 }
}
function permitted(node,focus){
 if(focus.depth===0) return node.depth<=2;
 if(focus.depth===1) return node===focus||(node.depth===2&&node.parent===focus);
 return node===focus||(node.depth===3&&node.parent===focus);
}
function labelLines(str,maxChars){
 const clean=String(str).replace(/\\/g,'/');
 if(clean.length<=maxChars)return[clean];
 const words=clean.split(/(?<=[-_ /])|(?=[A-Z])/).filter(Boolean);
 if(words.length<=1) return [clean.slice(0,Math.max(3,maxChars-1))+'…'];
 let best=null,score=Infinity;
 for(let i=1;i<words.length;i++){
   const a=words.slice(0,i).join('').trim(),b=words.slice(i).join('').trim();
   const penalty=Math.max(a.length,b.length) + Math.abs(a.length-b.length)*.18;
   if(a.length<=maxChars+2&&b.length<=maxChars+2&&penalty<score){score=penalty;best=[a,b]}
 }
 return best||[clean.slice(0,Math.max(3,maxChars-1))+'…'];
}
function labelNode(node,focus,k){
 const label=node.label;label.replaceChildren();let on=false;
 const screenR=node.r*k;
 if(focus.depth===0){on=node.depth===1&&screenR>35}
 else if(focus.depth===1){on=node.depth===2&&node.parent===focus&&screenR>28}
 else {on=node.depth===3&&node.parent===focus&&screenR>27}
 label.style.opacity=on?'1':'0';if(!on)return;
 const isSystem=node.depth===1;
 const px=isSystem?(view.w<560?9.4:11.5):screenR>75?12.2:screenR>48?11.3:10;
 const systemLower=isSystem && focus.depth===0 && node.id==='firmware';
 const labelY=isSystem?(systemLower?node.r+12/k:-node.r-13/k):0;
 const fm=px/k;
 label.setAttribute('font-size',fm);label.setAttribute('font-weight',isSystem?'800':'750');
 label.setAttribute('y',labelY);
 label.setAttribute('x','0');
 const text=isSystem?node.name.toUpperCase():(node.depth===3?node.name:node.name);
 const maxChars=Math.min(32,Math.max(7,Math.floor((2*screenR-17)/(px*.61))));
 let lines=isSystem?[text]:labelLines(text,maxChars);
 if(lines.length===1&&lines[0].length>maxChars &&!isSystem)lines=[lines[0].slice(0,maxChars-1)+'…'];
 if(lines.length>2)lines=lines.slice(0,2);
 for(let i=0;i<lines.length;i++){
  const span=el('tspan',{x:0,y:isSystem?labelY:(i-(lines.length-1)/2)*fm*1.31});
  span.textContent=lines[i];label.appendChild(span);
 }
}
function cameraFor(focus,details=false){
 const mobile=view.w<700,plotTop=mobile?133:143,plotBottom=mobile?(details?580:132):100;
 const availH=Math.max(140,view.h-plotTop-plotBottom);
 let availW=Math.max(130,view.w-(mobile?38:104));
 let x=view.w/2;
 if(details&&view.w>940){availW=Math.min(availW,view.w-405);x=Math.max(170,(view.w-365)/2)}
 const k=Math.min(availW/(2*focus.r),availH/(2*focus.r))*(focus.depth===0?.91:.90);
 const cy=plotTop+availH/2;
 return{k,tx:x-focus.wx*k,ty:cy-focus.wy*k};
}
function applyCamera(c){camera=c;world.setAttribute('transform',`translate(${c.tx} ${c.ty}) scale(${c.k})`)}
function animateCamera(target,initial=false){
 if(camFrame!==null)cancelAnimationFrame(camFrame);
 const from=camera||{...target,k:target.k*.75,ty:target.ty+35};
 const t0=performance.now();const duration=motionOff?0:initial?1100:840;
 function tick(now){
  const raw=duration?Math.max(0,Math.min(1,(now-t0)/duration)):1;
  const t=raw<.5?4*raw*raw*raw:1-Math.pow(-2*raw+2,3)/2;
  applyCamera({k:from.k+(target.k-from.k)*t,tx:from.tx+(target.tx-from.tx)*t,ty:from.ty+(target.ty-from.ty)*t});
  if(raw<1)camFrame=requestAnimationFrame(tick);else camFrame=null;
 }
 camFrame=requestAnimationFrame(tick);
}
function updateTrail(focus){
 const nav=document.querySelector('#ke-trail');nav.replaceChildren();
 const path=[];let n=focus;while(n){path.unshift(n);n=n.parent}
 for(let i=0;i<path.length;i++){
  if(i){const sep=document.createElement('span');sep.className='sep';sep.textContent='/';nav.appendChild(sep)}
  const step=path[i],btn=document.createElement('button');btn.type='button';btn.textContent=step===root?'All systems':step.name;
  if(step===focus)btn.setAttribute('aria-current','page');else btn.addEventListener('click',()=>navigate(step.id));
  nav.appendChild(btn);
 }
}
function updateLegend(){
 const nav=document.querySelector('#ke-legend');nav.replaceChildren();
 for(const item of root.children){
  const btn=document.createElement('button');btn.type='button';btn.classList.toggle('active',focusId===item.id);
  btn.innerHTML=h(item.name)+' <span>'+fmt.format(item.lines)+'</span>';btn.title='Explore '+item.name;
  btn.addEventListener('click',()=>navigate(focusId===item.id?'project':item.id));nav.appendChild(btn);
 }
}
function renderVisibility(){
 const focus=byId(focusId);const target=cameraFor(focus,!!selectedId);
 shell.dataset.depth=focus.depth;
 for(const node of flat){
   const show=permitted(node,focus);node.g.style.opacity=show?(node.depth===0?'.75':'1'):'0';
   node.g.style.pointerEvents=show && node.depth?'auto':'none';node.g.setAttribute('tabindex',show && node.depth?'0':'-1');
   node.g.classList.toggle('is-selected',node.id===selectedId);
   labelNode(node,focus,target.k);
 }
 updateTrail(focus);updateLegend();animateCamera(target,!camera);
}
function tipHide(){tip.classList.remove('show')}
function tipShow(node,e){
 if(e.pointerType==='touch'||!permitted(node,byId(focusId)))return;
 document.querySelector('#ke-tip-kind').textContent= node.depth===1?'SYSTEM':node.depth===2?'FUNCTIONAL MODULE':'SOURCE FILE';
 document.querySelector('#ke-tip-name').textContent=node.name;
 document.querySelector('#ke-tip-desc').textContent=node.description||(node.depth===3?node.path:node.raw.description)||'';
 document.querySelector('#ke-tip-meta').innerHTML=`<span>${fmt.format(node.lines)} lines</span><span>${fmt.format(node.files)} ${node.files===1?'file':'files'}</span>`;
 const rect=shell.getBoundingClientRect();let x=e.clientX-rect.left+19,y=e.clientY-rect.top+16;
 if(x+272>view.w)x=e.clientX-rect.left-274;if(y+170>view.h)y=e.clientY-rect.top-181;
 tip.style.left=Math.max(9,x)+'px';tip.style.top=Math.max(9,y)+'px';tip.classList.add('show');
}
function listFiles(node){return node.depth===3?[node]:node.children.flatMap(listFiles)}
function detail(node){
 selectedId=node.id;
 document.querySelector('#ke-panel-kicker').textContent=node.depth===1?'SOFTWARE SYSTEM':node.depth===2?'FUNCTIONAL MODULE':'SOURCE FILE';
 document.querySelector('#ke-panel-title').textContent=node.name;
 document.querySelector('#ke-panel-desc').textContent=node.description||(node.depth===3?node.path:'');
 document.querySelector('#ke-panel-lines').textContent=fmt.format(node.lines);
 document.querySelector('#ke-panel-count').textContent=fmt.format(node.files);
 const listing=document.querySelector('#ke-panel-files');listing.replaceChildren();
 const files=listFiles(node);
 const section=document.querySelector('#ke-panel-files-title');section.textContent=node.depth===3?'FILE PATH':'INCLUDED FILES';
 if(node.depth===3){const row=document.createElement('div');row.className='panel-file';row.innerHTML='<code>'+h(node.path)+'</code>';listing.appendChild(row)}
 else {
  files.sort((a,b)=>b.lines-a.lines).forEach(f=>{const row=document.createElement('div');row.className='panel-file';row.innerHTML='<code>'+h(f.path)+'</code><span>'+fmt.format(f.lines)+'</span>';listing.appendChild(row)});
 }
 const note=document.querySelector('#ke-panel-note');
 note.textContent='Source snapshot '+INPUT_DATA.source_revision.slice(0,8)+'. Scroll to inspect every included file.';
 panel.classList.add('open');shell.classList.add('has-detail');resize();panel.focus({preventScroll:true});
 renderVisibility();
}
function clearDetail(){if(!selectedId)return;selectedId=null;panel.classList.remove('open');shell.classList.remove('has-detail');resize();renderVisibility()}
function navigate(id){
 const node=byId(id);if(!node)return;
 tipHide();selectedId=null;panel.classList.remove('open');shell.classList.remove('has-detail');resize();focusId=id;
 for(const n of flat)n.g.classList.remove('is-hover');hoveredId=null;
 renderVisibility();
}
function activate(node){
 tipHide();if(node.depth===1)navigate(node.id);
 else if(node.depth===2){focusId=node.id;detail(node)}
 else if(node.depth===3){focusId=node.parent.id;detail(node)}
}
function resize(){
 const w=Math.round(shell.clientWidth),h=Math.round(shell.clientHeight);
 if(view.w===w&&view.h===h)return;view={w,h};svg.setAttribute('viewBox',`0 0 ${w} ${h}`);
 if(camera&&camFrame!==null){cancelAnimationFrame(camFrame);camFrame=null}
 renderVisibility();if(camFrame!==null){cancelAnimationFrame(camFrame);camFrame=null;}applyCamera(cameraFor(byId(focusId),!!selectedId));parent.postMessage({type:'knight-software-height',height:Math.ceil(shell.getBoundingClientRect().height)},location.origin);
}
function init(){
 create();
 document.querySelector('#ke-close').addEventListener('click',clearDetail);
 document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(selectedId)clearDetail();else if(focusId!=='project')navigate(byId(focusId).parent.id)}});
 svg.addEventListener('click',e=>{if(e.target===svg)clearDetail()});
 resize();
 if('ResizeObserver' in window)new ResizeObserver(()=>{if(resizeFrame)cancelAnimationFrame(resizeFrame);resizeFrame=requestAnimationFrame(resize)}).observe(shell);
 else window.addEventListener('resize',resize);
}
init();
})();
</script>
