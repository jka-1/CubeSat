<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CubeSat Battery Management and Power Delivery System</title>
  <meta
    name="description"
    content="Modular CubeSat Battery Management and Power Delivery System site with portfolio, live I²C telemetry, and partners pages."
  />
  <link rel="icon" type="image/png" href="./favicon.png?v=20261026a" />
  <link rel="stylesheet" href="./assets/css/styles.css?v=20261027b" />
  <link rel="stylesheet" href="./assets/css/streaming.css?v=20261019b" />
</head>
<body>
  <header class="site-header">
    <nav class="nav" aria-label="Main navigation">
      <a class="brand" href="#home" data-route="home" aria-label="CubeSat power system home">
        <span class="brand-mark">🛰️</span>
        <span>
          CubeSat PMDS
          <small>Battery Management · Power Delivery System</small>
        </span>
      </a>

      <div class="nav-links">
        <a class="nav-link active" href="#home" data-route="home">Portfolio</a>
        <a class="nav-link" href="#communication" data-route="communication">I²C Telemetry</a>
        <a class="nav-link" href="#link-health" data-route="link-health">Link Health</a>
        <a class="nav-link" href="#debug-mode" data-route="debug-mode">Debug Mode</a>
        <a class="nav-link" href="#runs" data-route="runs">Runs</a>
        <a id="streamingNavBadge" class="st-nav-badge" href="#debug-mode" title="Streaming Telemetry mode is on" hidden><i></i>Streaming</a>
        <a class="nav-link" href="#partners" data-route="partners">Partners</a>
      </div>
      <button id="accountButton" class="nav-link" type="button">Sign in</button>
    </nav>
  </header>

  <main id="accountPanel" class="account-panel" aria-labelledby="accountTitle" hidden>
    <div class="account-heading"><h1 id="accountTitle">Sign in</h1><button id="accountBack" type="button">Back</button></div>
    <p id="accountHelp">Use your CubeSat account to view telemetry and saved runs.</p>
    <form id="accountForm">
      <label for="accountUsername">Username</label>
      <input id="accountUsername" name="username" autocomplete="username" maxlength="64" required>
      <label for="accountPassword">Password</label>
      <input id="accountPassword" name="password" type="password" autocomplete="current-password" maxlength="256" required>
      <button id="accountSubmit" type="submit">Sign in</button>
    </form>
    <p id="accountMessage" role="status" aria-live="polite"></p>
    <button id="accountLogout" type="button" hidden>Sign out</button>
    <button id="accountRetry" type="button" hidden>Retry connection</button>
  </main>

  <main id="page-root" class="page-shell" aria-live="polite">
    <noscript>Please enable JavaScript to load the modular pages.</noscript>
  </main>

  <script type="module" src="./assets/js/app.js?v=20261027c"></script>
</body>
</html>
