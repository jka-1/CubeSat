<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CubeSat Power System Controller</title>
  <meta
    name="description"
    content="CubeSat power system dashboard with telemetry, register tools, and saved runs."
  />
  <link rel="icon" type="image/png" href="./favicon.png?v=20261026a" />
  <link rel="stylesheet" href="./assets/css/styles.css?v=20261109d" />
  <link rel="stylesheet" href="./assets/css/streaming.css?v=20261104d" />
</head>
<body>
  <header class="site-header">
    <nav class="nav" aria-label="Main navigation">
      <a class="brand" href="#home" data-route="home" aria-label="CubeSat Power System Controller home">
        <span class="brand-mark">🛰️</span>
        <span>
          CubeSat Power System Controller
        </span>
      </a>

      <div class="nav-links">
        <a class="nav-link active" href="#home" data-route="home">Home</a>
        <a class="nav-link" href="#dashboard" data-route="dashboard">Dashboard</a>
        <div class="account-control">
          <button id="accountButton" class="nav-link" type="button">Sign in</button>
        </div>
      </div>
    </nav>
    <div id="dashboardNavigation" class="dashboard-navigation" hidden>
      <button id="dashboardPrevious" class="dashboard-scroll" type="button" aria-label="Scroll dashboard sections left" aria-controls="dashboardTabs" hidden>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m14 6-6 6 6 6" /></svg>
      </button>
      <nav id="dashboardTabs" class="dashboard-tabs" aria-label="Dashboard sections" hidden>
        <a class="nav-link" href="#communication" data-route="communication">I²C Telemetry</a>
        <a class="nav-link" href="#link-health" data-route="link-health">Network Statistics</a>
        <a class="nav-link" href="#runs" data-route="runs">Logged Telemetry</a>
        <a class="nav-link" href="#twin" data-route="twin">Digital Twin</a>
        <a class="nav-link" href="#debug-mode" data-route="debug-mode" data-operator-only hidden>Programming</a>
        <a class="nav-link" href="#sequences" data-route="sequences" data-operator-only hidden>Branch Definition</a>
        <a class="nav-link" href="#manual" data-route="manual" data-operator-only hidden>Manual</a>
        <a id="streamingNavBadge" class="st-nav-badge" href="#communication" title="Streaming Telemetry mode is on" hidden><i></i>Streaming</a>
      </nav>
      <button id="dashboardNext" class="dashboard-scroll" type="button" aria-label="Scroll dashboard sections right" aria-controls="dashboardTabs" hidden>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m10 6 6 6-6 6" /></svg>
      </button>
    </div>
  </header>

  <main id="accountPanel" class="account-panel" aria-labelledby="accountTitle" hidden>
    <p class="account-kicker">OrbitalAddress account</p>
    <div class="account-heading"><h1 id="accountTitle">Sign in</h1><button id="accountBack" type="button" aria-label="Back to previous page">← Back</button></div>
    <p id="accountHelp">Sign in to access the dashboard. Your assigned role determines which sections are available.</p>
    <form id="accountForm">
      <label for="accountUsername">Username</label>
      <input id="accountUsername" name="username" autocomplete="username" maxlength="64" required>
      <label for="accountPassword">Password</label>
      <input id="accountPassword" name="password" type="password" autocomplete="current-password" maxlength="256" required>
      <button id="accountSubmit" type="submit">Sign in</button>
    </form>
    <p id="accountMessage" role="status" aria-live="polite"></p>
    <button id="accountLogout" type="button" hidden>Sign out</button>
    <button id="accountRetry" type="button" hidden>Retry connection</button>
  </main>

  <main id="page-root" class="page-shell" aria-live="polite">
    <noscript>Please enable JavaScript to load the modular pages.</noscript>
  </main>

  <script type="module" src="./assets/js/app.js?v=20261112-sequences"></script>
</body>
</html>
