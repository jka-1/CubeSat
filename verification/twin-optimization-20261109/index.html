<!doctype html><html><head><meta charset="utf-8"><title>Twin optimization validation</title><style>body{margin:0;background:#111;color:white;font:14px monospace}iframe{width:1290px;height:720px;border:0}button{margin:8px;padding:8px}pre{white-space:pre-wrap}#gallery{display:flex;flex-wrap:wrap}figure{margin:8px;width:620px}img{width:620px} </style></head><body><button id="baseline">Measure baseline</button><button id="optimized">Measure optimized</button><button id="visual">Check interactions and capture comparison</button><span id="status">Ready</span><iframe id="viewer"></iframe><pre id="results"></pre><div id="gallery"></div><script type="module">
const viewer=document.querySelector('#viewer'),output=document.querySelector('#results'),status=document.querySelector('#status');
window.report=data=>{output.textContent=JSON.stringify(data,null,2);status.textContent=data.error?'Failed':data.complete?'Complete':'Measuring';fetch('/__result',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)})};
for(const variant of ['baseline','optimized'])document.querySelector('#'+variant).onclick=()=>{status.textContent='Loading '+variant;viewer.src='/site/knight-eps-phase12/viewer/?variant='+variant};
document.querySelector('#visual').onclick=async()=>{status.textContent='Checking';try{const {run}=await import('./visual.mjs');await run({viewer,output,status})}catch(e){status.textContent='Failed';output.textContent=e.stack}};
</script></body></html>
